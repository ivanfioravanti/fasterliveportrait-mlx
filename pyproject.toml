[project]
name = "fasterliveportrait-mlx"
version = "0.1.0"
description = "Apple MLX port of FasterLivePortrait for Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorama",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastapi",
    "ffmpeg-python",
    "gradio",
    "huggingface-hub",
    "misaki[en,ja,zh]",
    "mlx",
    "mlx-audio",
    "munch",
    "numpy",
    "omegaconf",
    "opencv-python",
    "pydantic",
    "scikit-image",
    "scipy",
    "soundfile",
    "torch",
    "torchvision",
    "transformers",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pyflakes",
    "pytest",
]
convert = [
    "onnx",
]

[tool.uv]
package = false
